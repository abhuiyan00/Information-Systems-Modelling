server.servlet.context-path=/StudentsApp
spring.application.name=StudentsApp

# ── H2 Database Configuration ──
# File-based (data survives restarts):
spring.datasource.url=jdbc:h2:file:./modellingclubdb
# In-memory alternative (data lost on restart, uncomment to use):
# spring.datasource.url=jdbc:h2:mem:modellingclubdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ──
spring.jpa.show-sql=true
# "update" keeps the schema in sync with the entities but never drops
# existing data on restart. Switch to "create-drop" only when you are
# redesigning tables.
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

# ── H2 Console (web UI to browse your database) ──
spring.h2.console.enabled=true
spring.h2.console.path=/h2-ui

# ── Multipart upload limits (must match MediaController constants) ──
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=200MB
