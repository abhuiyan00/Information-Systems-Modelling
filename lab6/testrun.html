<!doctype html>
<!--
  ModellingClub — Test run (server-rendered snapshot).
  RDFa: schema:Event + custom mc:TestRun. location → schema:Place,
        startDate, organizer → Person, attendee → Person (×3).
  JSON-LD mirrors the Event.
-->
<html lang="en"
      vocab="https://schema.org/"
      prefix="mc:   http://modellingclub.local/ontology#
              mcr:  http://modellingclub.local/resource/
              schema: https://schema.org/
              xsd:  http://www.w3.org/2001/XMLSchema#">
<head>
  <meta charset="utf-8">
  <title>Spring 2025 Test Run — ModellingClub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">

  <script type="application/ld+json">
  {
    "@context": {
      "@vocab": "https://schema.org/",
      "mc": "http://modellingclub.local/ontology#",
      "mcr": "http://modellingclub.local/resource/",
      "xsd": "http://www.w3.org/2001/XMLSchema#"
    },
    "@id": "mcr:testrun-spring2025",
    "@type": ["Event", "mc:TestRun"],
    "name": "Spring 2025 Test Run",
    "startDate": "2025-05-18T09:00:00Z",
    "eventStatus": "https://schema.org/EventScheduled",
    "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
    "location": {
      "@type": "Place",
      "name": "Wrocław airstrip, PL",
      "address": { "@type": "PostalAddress", "addressLocality": "Wrocław", "addressCountry": "PL" }
    },
    "organizer": { "@id": "mcr:user-carol", "@type": ["Person","mc:AdminUser"], "name": "carol" },
    "attendee": [
      { "@id": "mcr:user-alice", "@type": ["Person","mc:User"], "name": "alice" },
      { "@id": "mcr:user-bob",   "@type": ["Person","mc:User"], "name": "bob" },
      { "@id": "mcr:user-dave",  "@type": ["Person","mc:User"], "name": "dave" }
    ],
    "mc:testRunLocation": "Wrocław airstrip, PL",
    "mc:testRunDate": { "@type": "xsd:dateTime", "@value": "2025-05-18T09:00:00Z" }
  }
  </script>
</head>

<body>
  <!-- ════ VOCAB MAP (this page) ═══════════════════════════════════════
       schema.org : Event, Place, PostalAddress, Person;
                    name/startDate/location/organizer/attendee
       custom mc: : mc:TestRun, mc:testRunLocation, mc:testRunDate,
                    mc:organisedBy, mc:attendedBy, mc:User, mc:AdminUser
       custom-ONLY sections: none (mc: dual-annotated with schema.org)
       ═══════════════════════════════════════════════════════════════════ -->
  <nav>
    <a href="index.html" class="site-footer-brand" style="text-decoration:none">✈ ModellingClub</a>
    <span class="sep">|</span>
    <a href="index.html">Home</a>
    <a href="builds.html">Explore</a>
    <a href="marketplace.html">Marketplace</a>
    <a href="testrun.html" class="active">Test Runs</a>
    <a href="member-alice.html">Members</a>
  </nav>

  <div class="page-wrapper">
    <div class="glass-card" style="margin-bottom:1.5rem"
         about="mcr:testrun-spring2025" typeof="schema:Event mc:TestRun">
      <h1 property="schema:name">Spring 2025 Test Run</h1>
      <link property="eventStatus" href="https://schema.org/EventScheduled">
      <link property="eventAttendanceMode" href="https://schema.org/OfflineEventAttendanceMode">

      <p style="margin-bottom:1rem">
        <span class="badge badge-published">scheduled</span>
        &middot;
        <time property="schema:startDate mc:testRunDate" datatype="xsd:dateTime"
              datetime="2025-05-18T09:00:00Z" content="2025-05-18T09:00:00Z">18 May 2025, 09:00 UTC</time>
      </p>

      <!-- location: schema:Place; custom mc:testRunLocation keeps the plain string too -->
      <div class="spec-item" style="margin-bottom:1rem; max-width:360px"
           rel="schema:location" typeof="schema:Place">
        <span class="spec-label">Location</span>
        <span class="spec-value" property="schema:name mc:testRunLocation">Wrocław airstrip, PL</span>
        <span rel="schema:address" typeof="PostalAddress">
          <meta property="addressLocality" content="Wrocław">
          <meta property="addressCountry" content="PL">
        </span>
      </div>

      <p>
        Organised by
        <a href="member-alice.html" rel="schema:organizer mc:organisedBy" resource="mcr:user-carol"
           typeof="schema:Person mc:AdminUser" style="color:var(--primary)">
          <span property="schema:name mc:username">carol</span></a>
      </p>
    </div>

    <!-- Attendees — separate card, re-bound to the same Event via about -->
    <div class="glass-card" about="mcr:testrun-spring2025">
      <h3>Attendees</h3>
      <ul style="list-style:none; padding:0; margin:0; display:flex; gap:1rem; flex-wrap:wrap">
        <li rel="schema:attendee mc:attendedBy" resource="mcr:user-alice" typeof="schema:Person mc:User">
          <span class="avatar">AL</span> <span property="schema:name mc:username">alice</span>
        </li>
        <li rel="schema:attendee mc:attendedBy" resource="mcr:user-bob" typeof="schema:Person mc:User">
          <span class="avatar">BO</span> <span property="schema:name mc:username">bob</span>
        </li>
        <li rel="schema:attendee mc:attendedBy" resource="mcr:user-dave" typeof="schema:Person mc:User">
          <span class="avatar">DA</span> <span property="schema:name mc:username">dave</span>
        </li>
      </ul>
    </div>
  </div>

  <footer class="site-footer"><div class="site-footer-copy">ModellingClub — Lab 6 semantic-markup snapshot.</div></footer>
</body>
</html>
