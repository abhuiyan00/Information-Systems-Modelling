server.servlet.context-path=/StudentsApp
spring.application.name=StudentsApp

# ── H2 Database Configuration ──
# File-based (data survives restarts):
spring.datasource.url=jdbc:h2:file:./modellingclubdb
# In-memory alternative (data lost on restart, uncomment to use):
# spring.datasource.url=jdbc:h2:mem:modellingclubdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ──
spring.jpa.show-sql=false
# "update" keeps the schema in sync with the entities but never drops
# existing data on restart. Switch to "create-drop" only when you are
# redesigning tables. Use "validate" + Flyway in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# ── H2 Console (dev only — disable in prod via application-prod.properties) ──
spring.h2.console.enabled=true
spring.h2.console.path=/h2-ui

# ── Error responses — never expose stack traces or internal messages ──
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ── Multipart upload limits (must match MediaController constants) ──
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=200MB

# ── Media file storage ──
# Files are written to this directory (relative to the working dir)
# and served back at ${app.public.base-url}/uploads/{buildId}/{filename}.
app.upload.dir=./uploads
app.public.base-url=http://localhost:8080/StudentsApp

# ── CORS ──
# Comma-separated list of allowed origins. Override with CORS_ORIGINS env var in prod.
cors.allowed-origins=http://localhost:4200

# ── JWT ──
# Set to a stable base64-encoded 256-bit key in production to survive restarts.
# Generate: openssl rand -base64 32
# If blank, a random key is generated per JVM start (dev mode — tokens invalidate on restart).
jwt.secret=
