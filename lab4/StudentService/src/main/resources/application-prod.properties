# =============================================================================
# PRODUCTION PROFILE
# Activate: --spring.profiles.active=prod  (or SPRING_PROFILES_ACTIVE=prod)
# =============================================================================

# ─── Server ──────────────────────────────────────────────────────────────────
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.tomcat.max-http-form-post-size=2MB

# ─── Database (PostgreSQL) ───────────────────────────────────────────────────
# Uncomment and set env vars when migrating from H2 to PostgreSQL:
# spring.datasource.url=${DB_URL}
# spring.datasource.username=${DB_USER}
# spring.datasource.password=${DB_PASSWORD}
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#
# After adding Flyway migrations (V1__baseline.sql from current H2 schema):
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ─── HikariCP connection pool ────────────────────────────────────────────────
spring.datasource.hikari.pool-name=ModellingClubPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
# max-lifetime must be < DB server's wait_timeout (MariaDB/MySQL) or
# idle_in_transaction_session_timeout (PostgreSQL). 30 min is safe default.
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# ─── H2 (disabled in prod) ───────────────────────────────────────────────────
spring.h2.console.enabled=false

# ─── Actuator ────────────────────────────────────────────────────────────────
# Expose only health + info; bind management to loopback for internal infra only.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.env.show-values=never
management.server.port=8081
management.server.address=127.0.0.1

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.pl.edu.pwr.tkubik.ism=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN
# For JSON structured logging add logstash-logback-encoder and configure
# logback-spring.xml with JsonEncoder.

# ─── Multipart ───────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# ─── JWT ─────────────────────────────────────────────────────────────────────
# REQUIRED — generate: openssl rand -base64 32
# Never hardcode here; inject via environment variable or secret manager.
jwt.secret=${JWT_SECRET}

# ─── CORS ────────────────────────────────────────────────────────────────────
# Comma-separated list of production frontend origin(s)
cors.allowed-origins=${CORS_ORIGINS}

# ─── Public base URL (media files) ───────────────────────────────────────────
app.public.base-url=${APP_PUBLIC_BASE_URL}
app.upload.dir=${APP_UPLOAD_DIR:/var/data/modellingclub/uploads}
