<div class="page-wrapper">
  <div class="page-header">
    <div>
      <h1>My Builds</h1>
      <p style="margin-top:0.25rem; font-size:0.9rem">Drafts, pending reviews, and your published work.</p>
    </div>
    <a routerLink="/builds/create" class="btn btn-primary">+ New Build</a>
  </div>

  <!-- Status tabs -->
  <div style="display:flex; gap:0.4rem; flex-wrap:wrap; margin-bottom:1.25rem">
    <button class="btn" [class.btn-primary]="status === 'all'" [class.btn-ghost]="status !== 'all'"
            (click)="applyStatus('all')">All <span style="opacity:0.6; margin-left:0.4rem">{{ counts.all }}</span></button>
    <button class="btn" [class.btn-primary]="status === 'draft'" [class.btn-ghost]="status !== 'draft'"
            (click)="applyStatus('draft')">Drafts <span style="opacity:0.6; margin-left:0.4rem">{{ counts.draft }}</span></button>
    <button class="btn" [class.btn-primary]="status === 'pending_review'" [class.btn-ghost]="status !== 'pending_review'"
            (click)="applyStatus('pending_review')">Pending <span style="opacity:0.6; margin-left:0.4rem">{{ counts.pending_review }}</span></button>
    <button class="btn" [class.btn-primary]="status === 'published'" [class.btn-ghost]="status !== 'published'"
            (click)="applyStatus('published')">Published <span style="opacity:0.6; margin-left:0.4rem">{{ counts.published }}</span></button>
    @if (counts.rejected > 0) {
      <button class="btn" [class.btn-primary]="status === 'rejected'" [class.btn-ghost]="status !== 'rejected'"
              (click)="applyStatus('rejected')">Rejected <span style="opacity:0.6; margin-left:0.4rem">{{ counts.rejected }}</span></button>
    }
  </div>

  @if (visible.length > 0) {
    <div class="build-grid">
      @for (b of visible; track b.id) {
        <app-build-card [build]="b"></app-build-card>
      }
    </div>
  } @else {
    <div class="glass-card" style="text-align:center; padding:3rem">
      <p style="color:var(--text-muted)">
        @if (mine.length === 0) {
          You have no builds yet.
          <a routerLink="/builds/create" style="color:var(--primary)">Create your first one.</a>
        } @else {
          No builds in this state.
        }
      </p>
    </div>
  }
</div>
